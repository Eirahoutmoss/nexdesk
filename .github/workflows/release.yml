name: Deneme sürümü
on:
  push:
    branches: [deneme-1.5.4]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c NexDesk.exe.sha256
          gh release delete v1.5.4-test --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create v1.5.4-test NexDesk.exe NexDesk.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --target 1491311b3a24c44c666dfe5b22fee79ff4ba2b3c \
            --title "NexDesk 1.5.4 (deneme)" --notes-file NOTES.md
